name: build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build Neo4j - Spatial Components
    runs-on: ubuntu-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-maven-cache
      - uses: ./.github/actions/run-tests

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/target/surefire-reports/*.xml"
          report_individual_runs: "true"

  docs:
    name: Check generated docs are up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-maven-cache
      # Generators only write files; prune so removed APIs/examples show up as deleted
      - name: Regenerate docs
        run: |
          rm -rf docs/docs/modules/ROOT/partials/generated docs/docs/modules/ROOT/pages/geo-pipes/examples/generated
          ./mvnw --no-transfer-progress -Pgenerate-docs verify -pl doc-examples -am -Dtest=GeoPipesDocTest -Dsurefire.failIfNoSpecifiedTests=false
        shell: bash
      # PNGs are excluded: rendering is not byte-stable across JDKs and fonts
      - name: Fail on stale docs
        run: |
          changes=$(git status --porcelain -- 'docs/**/*.adoc')
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Generated docs are stale, run: ./mvnw -Pgenerate-docs verify -pl doc-examples -am"
            exit 1
          fi
        shell: bash
