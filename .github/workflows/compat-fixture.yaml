name: compat fixture

# Adds an upgrade-compatibility fixture (compat-tests) for a published release if its store format is new:
# generates a store with the released plugin, writes its expected.txt and opens a PR. Same format as an existing
# fixture: nothing to do. Fails if the newest fixture's scripts don't work for the release; then create the
# fixture by hand (compat-tests/src/test/compat/generate-fixture.sh).

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Released plugin version (tag)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fixture:
    name: Add compat fixture if the store format is new
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # tags: the release's Neo4j version is read from its pom.xml
          fetch-depth: 0
      - uses: ./.github/actions/setup-jdk
      - uses: ./.github/actions/setup-maven-cache

      - name: Generate store
        run: |
          neo4j=$(git show "$VERSION:pom.xml" | grep -m1 -oP '(?<=<neo4j.version>)[^<]+')
          compat-tests/src/test/compat/generate-fixture.sh --reuse-scripts "$VERSION" "$neo4j"

      - name: Write expected.txt
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl compat-tests -am install -DskipTests
          ./mvnw --batch-mode --no-transfer-progress -pl compat-tests test -Dtest=UpgradeCompatibilityTest \
            -Dcompat.update=true

      - name: Check store format
        id: format
        run: |
          if compat-tests/src/test/compat/format-changed.sh "$VERSION"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.format.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="compat/fixture-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "compat-tests/src/test/resources/compat/$VERSION"
          git commit -m "Add upgrade compatibility fixture for release $VERSION"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Add upgrade compatibility fixture for release $VERSION" \
            --body "Release $VERSION writes a new store format. Generated by the compat fixture workflow with the scripts of the newest fixture; review \`expected.txt\`. Close and reopen this PR to run the PR build."
